#\u5E94\u7528\u540D\u79F0
spring.application.name=foodsource

#\u8BBF\u95EE\u7AEF\u53E3\u53F7
server.port = 8888

#\u7F16\u7801\u683C\u5F0F
server.tomcat.uri-encoding=utf-8

#d\u6570\u636E\u5E93\u76F8\u5173\u914D\u7F6E
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/food?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&serverTimezone=Asia/Shanghai
spring.datasource.databaseName=food
spring.datasource.username=root
spring.datasource.password=root
#\u521D\u59CB\u8FDE\u63A5\u6570
spring.datasource.initialSize=30
#\u6700\u5927\u8FDE\u63A5\u6570
spring.datasource.maxActive=50
#\u6700\u5927\u7A7A\u95F2
spring.datasource.maxIdle=20
#\u6700\u5C0F\u7A7A\u95F2
spring.datasource.minIdle=10
#\u6700\u957F\u7B49\u5F85\u65F6\u95F4
spring.datasource.maxWait=60000

#redis\u76F8\u5173\u914D\u7F6E
spring.redis.host=127.0.0.1
#Redis\u670D\u52A1\u5668\u8FDE\u63A5\u7AEF\u53E3
spring.redis.port=6379
#Redis\u670D\u52A1\u5668\u8FDE\u63A5\u5BC6\u7801\uFF08\u9ED8\u8BA4\u4E3A\u7A7A\uFF09
spring.redis.password=
#\u8FDE\u63A5\u6C60\u6700\u5927\u8FDE\u63A5\u6570\uFF08\u4F7F\u7528\u8D1F\u503C\u8868\u793A\u6CA1\u6709\u9650\u5236\uFF09
spring.redis.pool.max-active=8
#\u8FDE\u63A5\u6C60\u6700\u5927\u963B\u585E\u7B49\u5F85\u65F6\u95F4\uFF08\u4F7F\u7528\u8D1F\u503C\u8868\u793A\u6CA1\u6709\u9650\u5236\uFF09
spring.redis.pool.max-wait=-1
#\u8FDE\u63A5\u6C60\u4E2D\u7684\u6700\u5927\u7A7A\u95F2\u8FDE\u63A5
spring.redis.pool.max-idle=8
#\u8FDE\u63A5\u6C60\u4E2D\u7684\u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5
spring.redis.pool.min-idle=0
#\u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09
spring.redis.timeout=30000

#session\u751F\u547D\u5468\u671F
server.servlet.session.timeout=-1

#mybatis
mybatis.typeAliasesPackage=com.colin.foodsource.model
mybatis.mapperLocations=classpath:/mappers/*.xml
mybatis.configLocation=classpath:/mybatis-config.xml

#actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.base-path=/actuator
endpoints.info.enabled=true
#management.context-path=/colin

#pagehelper\u5206\u9875\u63D2\u4EF6\u914D\u7F6E
#\u6807\u8BC6\u662F\u54EA\u4E00\u79CD\u6570\u636E\u5E93
#pagehelper.helperDialect=mysql
##\u542F\u7528\u5408\u7406\u5316\uFF0C\u5982\u679CpageNum<1\u4F1A\u67E5\u8BE2\u7B2C\u4E00\u9875\uFF0C\u5982\u679CpageNum>pages\u4F1A\u67E5\u8BE2\u6700\u540E\u4E00\u9875
#pagehelper.reasonable=true
##\u4E3A\u4E86\u652F\u6301startPage(Object params)\u65B9\u6CD5\uFF0C\u589E\u52A0\u4E86\u8BE5\u53C2\u6570\u6765\u914D\u7F6E\u53C2\u6570\u6620\u5C04\uFF0C\u7528\u4E8E\u4ECE\u5BF9\u8C61\u4E2D\u6839\u636E\u5C5E\u6027\u540D\u53D6\u503C\uFF0C
##\u53EF\u4EE5\u914D\u7F6EpageNum,pageSize,count,pageSizeZero,reasonable\uFF0C\u4E0D\u914D\u7F6E\u6620\u5C04\u7684\u7528\u9ED8\u8BA4\u503C\uFF0C
##\u9ED8\u8BA4\u503C\u4E3ApageNum=pageNum;pageSize=pageSize;count=countSql;reasonable=reasonable;pageSizeZero=pageSizeZero
#pagehelper.params=count=countSql
##\u652F\u6301\u901A\u8FC7 Mapper \u63A5\u53E3\u53C2\u6570\u6765\u4F20\u9012\u5206\u9875\u53C2\u6570\uFF0C\u9ED8\u8BA4\u503Cfalse\uFF0C\u5206\u9875\u63D2\u4EF6\u4F1A\u4ECE\u67E5\u8BE2\u65B9\u6CD5\u7684\u53C2\u6570\u503C\u4E2D\uFF0C\u81EA\u52A8\u6839\u636E\u4E0A\u9762 params \u914D\u7F6E\u7684\u5B57\u6BB5\u4E2D\u53D6\u503C\uFF0C\u67E5\u627E\u5230\u5408\u9002\u7684\u503C\u65F6\u5C31\u4F1A\u81EA\u52A8\u5206\u9875
#pagehelper.supportMethodsArguments=true
##\u5982\u679C pageSize=0 \u5C31\u4F1A\u67E5\u8BE2\u51FA\u5168\u90E8\u7684\u7ED3\u679C\uFF08\u76F8\u5F53\u4E8E\u6CA1\u6709\u6267\u884C\u5206\u9875\u67E5\u8BE2\uFF09
#pagehelper.page-size-zero=true

