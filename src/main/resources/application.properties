#\u5E94\u7528\u540D\u79F0
spring.application.name=foodsource

#\u8BBF\u95EE\u7AEF\u53E3\u53F7
server.port = 8888

#\u7F16\u7801\u683C\u5F0F
server.tomcat.uri-encoding=utf-8

#d\u6570\u636E\u5E93\u76F8\u5173\u914D\u7F6E
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/food?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&serverTimezone=Asia/Shanghai
spring.datasource.databaseName=food
spring.datasource.username=root
spring.datasource.password=root
#\u521D\u59CB\u8FDE\u63A5\u6570
spring.datasource.initialSize=30
#\u6700\u5927\u8FDE\u63A5\u6570
spring.datasource.maxActive=50
#\u6700\u5927\u7A7A\u95F2
spring.datasource.maxIdle=20
#\u6700\u5C0F\u7A7A\u95F2
spring.datasource.minIdle=10
#\u6700\u957F\u7B49\u5F85\u65F6\u95F4
spring.datasource.maxWait=60000

#session\u751F\u547D\u5468\u671F
server.servlet.session.timeout=-1

#mybatis
mybatis.typeAliasesPackage=com.colin.foodsource.model
mybatis.mapperLocations=classpath:/mappers/*.xml
mybatis.configLocation=classpath:/mybatis-config.xml

